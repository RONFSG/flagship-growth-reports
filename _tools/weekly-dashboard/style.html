<style>@import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;600&display=swap");.animate{opacity:0;transition:opacity 0.6s ease,transform 0.6s ease;transform:translateY(18px);}.animate.visible{opacity:1;transform:translateY(0);}:root{--orange:#2447FF;--navy:#0F172A;--muted:#6B6558;--subtle:#9E9689;--border:#E5E0D6;--green:#16A34A;--red:#DC2626;--amber:#D97706;}*{margin:0;padding:0;box-sizing:border-box;}body{background:#F6F3EC;color:var(--navy);font-family:"Space Grotesk","Quicksand",sans-serif;font-size:13px;line-height:1.6;padding:32px 20px;}.page{max-width:1040px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,0.08);}.header{padding:22px 32px 18px;border-bottom:2px solid var(--navy);display:flex;justify-content:space-between;align-items:center;}.header-logo{height:52px;width:auto;display:block;}.header-sub{font-size:9px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-top:2px;}.header-title{font-size:22px;font-weight:800;color:var(--navy);letter-spacing:-0.03em;line-height:1;text-align:right;}.header-title span{color:var(--orange);}.header-period{font-size:11px;color:var(--muted);margin-top:4px;font-weight:500;text-align:right;}.container{padding:24px 32px 36px;}.kpi-grid-wide{display:grid;grid-template-columns:repeat(8,1fr);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:24px;}.kpi-card{padding:14px 10px;border-right:1px solid var(--border);}.kpi-card:last-child{border-right:none;}.kpi-value{font-size:16px;font-weight:800;letter-spacing:-0.02em;color:var(--navy);line-height:1;margin-bottom:5px;}.kpi-label{font-size:9px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}.kpi-change{font-size:11px;font-weight:600;}.up{color:var(--green);}.down{color:var(--red);}.neutral{color:var(--muted);}.two-col{display:grid;grid-template-columns:1fr 1fr
